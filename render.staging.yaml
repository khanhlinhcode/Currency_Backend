# Separate staging resources. Select this file as the Blueprint Path in Render.
services:
  - type: web
    name: currency-ai-staging
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: currency-ai-staging-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MODEL_S3_KEY
        sync: false
      - key: INFERENCE_CONCURRENCY
        value: '1'

databases:
  - name: currency-ai-staging-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: currency_ai_staging
    user: currency_staging_api
