# Free, sleeping staging only. PostgreSQL and private S3 storage are external.
services:
  - type: web
    name: currency-ai-free-staging
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-api-free.txt
    startCommand: sh -c 'python -m alembic upgrade head && exec python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: '3.11.11'
      - key: APP_ENV
        value: staging
      - key: MODEL_PATH
        value: models/efficientnetb0_candidate.onnx
      - key: MODEL_MANIFEST_PATH
        value: models/edge-manifest.json
      - key: MODEL_S3_KEY
        value: staging/models/1.1.0/efficientnetb0_candidate.onnx
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: INFERENCE_CONCURRENCY
        value: '1'
