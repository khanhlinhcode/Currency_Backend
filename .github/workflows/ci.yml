name: Backend CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release manifest and Python syntax
        run: |
          python scripts/verify_release.py
          python -m compileall -q api migrations scripts training
      - name: Test database migrations on a fresh database
        run: |
          python -m pip install -r requirements-api-free.txt 'moto[s3]==5.1.17'
          DATABASE_URL=sqlite:///./ci.db python -m alembic upgrade head
          DATABASE_URL=sqlite:///./ci.db python -m alembic upgrade head
          python -m unittest discover -s tests
