name: Backend CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release manifest and Python syntax
        run: |
          python scripts/verify_release.py
          python -m compileall -q api migrations scripts training
      - name: Test database migrations on a fresh database
        run: |
          python -m pip install sqlalchemy==2.0.40 alembic==1.15.2 boto3==1.37.30 'moto[s3]==5.1.17' 'psycopg[binary]==3.2.6' cryptography
          DATABASE_URL=sqlite:///./ci.db python -m alembic upgrade head
          DATABASE_URL=sqlite:///./ci.db python -m alembic upgrade head
          python -m unittest discover -s tests
